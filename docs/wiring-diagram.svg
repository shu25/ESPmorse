<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <style>
    .bg{fill:#f7faf8}.board{fill:#173b32;stroke:#0b201b;stroke-width:4}.box{fill:#fff;stroke:#334b44;stroke-width:3}.keybox{fill:#fff8df;stroke:#b17b00;stroke-width:3}.wire{fill:none;stroke:#263b35;stroke-width:5}.gnd{stroke:#222}.sig{stroke:#cf3f38}.green{stroke:#268a55}.blue{stroke:#2473a8}.dash{stroke-dasharray:12 9}.pin{fill:#f7d66b;stroke:#5e4a0b;stroke-width:2}.txt{font:24px sans-serif;fill:#14231f}.small{font:19px sans-serif;fill:#314640}.title{font:bold 38px sans-serif;fill:#10251f}.label{font:bold 23px sans-serif;fill:#fff}.note{font:bold 20px sans-serif;fill:#835d00}.sw{fill:none;stroke:#222;stroke-width:5;stroke-linecap:round}.node{fill:#222}
  </style>
  <rect class="bg" width="1400" height="920"/>
  <text x="55" y="62" class="title">ESPmorse 配線図 — ESP32-C3 SuperMini</text>
  <text x="55" y="96" class="small">電鍵・ボタンはすべて INPUT_PULLUP：押すと GPIO と GND を接続</text>

  <rect x="500" y="145" width="390" height="650" rx="35" class="board"/>
  <text x="695" y="195" text-anchor="middle" class="label">ESP32-C3 SuperMini</text>
  <text x="695" y="230" text-anchor="middle" class="label">ESPmorse</text>

  <circle cx="500" cy="285" r="12" class="pin"/><text x="530" y="293" class="label">GPIO4  KEY</text>
  <circle cx="500" cy="365" r="12" class="pin"/><text x="530" y="373" class="label">GPIO7  MUTE</text>
  <circle cx="500" cy="445" r="12" class="pin"/><text x="530" y="453" class="label">GPIO10 SEND</text>
  <circle cx="500" cy="525" r="12" class="pin"/><text x="530" y="533" class="label">GPIO0  BAT ADC</text>
  <circle cx="500" cy="690" r="12" class="pin"/><text x="530" y="698" class="label">GND</text>

  <circle cx="890" cy="285" r="12" class="pin"/><text x="860" y="293" text-anchor="end" class="label">GPIO5 BUZZER</text>
  <circle cx="890" cy="405" r="12" class="pin"/><text x="860" y="413" text-anchor="end" class="label">GPIO6 ACT LED</text>
  <circle cx="890" cy="525" r="12" class="pin"/><text x="860" y="533" text-anchor="end" class="label">GPIO3 STATUS LED</text>
  <circle cx="890" cy="690" r="12" class="pin"/><text x="860" y="698" text-anchor="end" class="label">3V3 / GND</text>

  <!-- external key ladder -->
  <rect x="45" y="160" width="385" height="410" rx="24" class="keybox"/>
  <text x="237" y="203" text-anchor="middle" class="note">外装へ出す電鍵バス（2線）</text>
  <text x="78" y="245" class="small">J1端子台：KEY / GND</text>
  <path d="M500 285 H430 H105 V315" class="wire sig"/>
  <path d="M500 690 H455 V530 H105 V465" class="wire gnd"/>
  <circle cx="105" cy="315" r="6" class="node"/><circle cx="105" cy="465" r="6" class="node"/>
  <text x="65" y="323" class="small">KEY</text><text x="60" y="473" class="small">GND</text>
  <path d="M105 315 H385" class="wire sig"/><path d="M105 465 H385" class="wire gnd"/>
  <!-- switch rungs -->
  <path d="M175 315 V365 M175 415 V465" class="wire"/><circle cx="175" cy="365" r="5" class="node"/><circle cx="175" cy="415" r="5" class="node"/><path d="M175 365 L205 405" class="sw"/><text x="145" y="505" class="small">電鍵1 (NO)</text>
  <path d="M280 315 V365 M280 415 V465" class="wire"/><circle cx="280" cy="365" r="5" class="node"/><circle cx="280" cy="415" r="5" class="node"/><path d="M280 365 L310 405" class="sw"/><text x="250" y="505" class="small">電鍵2 (NO)</text>
  <path d="M385 315 V365 M385 415 V465" class="wire"/><circle cx="385" cy="365" r="5" class="node"/><circle cx="385" cy="415" r="5" class="node"/><path d="M385 365 L415 405" class="sw"/><text x="355" y="505" class="small">追加可</text>
  <text x="72" y="548" class="small">各スイッチは並列。どれかを押すとON。</text>

  <!-- local buttons -->
  <rect x="85" y="610" width="300" height="75" rx="16" class="box"/><text x="105" y="655" class="txt">消音SW (NO)</text><path d="M385 647 H450 V365 H500" class="wire blue"/>
  <rect x="85" y="715" width="300" height="75" rx="16" class="box"/><text x="105" y="760" class="txt">送信SW (NO)</text><path d="M385 752 H475 V445 H500" class="wire green"/>
  <path d="M135 685 V835 H450 V690 H500 M135 790 V835" class="wire gnd"/>
  <text x="85" y="865" class="small">各SWのもう一方は共通GNDへ</text>

  <!-- buzzer -->
  <path d="M890 285 H1010" class="wire blue"/><rect x="1010" y="235" width="300" height="100" rx="18" class="box"/><text x="1035" y="278" class="txt">圧電ブザー +</text><text x="1035" y="310" class="small">− → GND（小電流品）</text>
  <!-- leds -->
  <path d="M890 405 H970" class="wire green"/><rect x="970" y="365" width="95" height="78" rx="12" class="box"/><text x="985" y="413" class="small">330Ω</text><path d="M1065 405 H1120" class="wire green"/><circle cx="1150" cy="405" r="28" fill="#57df8b" stroke="#174e2b" stroke-width="4"/><text x="1195" y="413" class="txt">動作LED</text>
  <path d="M890 525 H970" class="wire sig"/><rect x="970" y="485" width="95" height="78" rx="12" class="box"/><text x="985" y="533" class="small">330Ω</text><path d="M1065 525 H1120" class="wire sig"/><circle cx="1150" cy="525" r="28" fill="#ff795f" stroke="#77291c" stroke-width="4"/><text x="1195" y="533" class="txt">状態LED</text>
  <path d="M1150 433 V690 M1150 553 V690 M1160 335 V690 M890 690 H1260" class="wire gnd"/>
  <text x="1210" y="680" class="small">共通GND</text>

  <!-- optional battery -->
  <path d="M500 525 H450 V585 H410" class="wire dash sig"/>
  <text x="54" y="595" class="small">電池監視は任意：BAT+—100kΩ—GPIO0—100kΩ—GND</text>
  <text x="940" y="760" class="note">重要：GPIOへ5Vを入れない</text>
  <text x="940" y="792" class="small">外部SWは無電圧接点を使用</text>
  <text x="940" y="824" class="small">長い電鍵線は2本を撚ると誤動作しにくい</text>
</svg>
