<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09120f"><title>ESPmorse Controller</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="chat.css"></head><body><main>
<header><div><p class="eyebrow">ESP-NOW / BLE TERMINAL</p><h1>ESP<span>morse</span></h1></div><button id="connect" class="connect"><i></i><span>接続する</span></button></header>
<section class="hero card"><div><p class="label">DEVICE</p><strong id="deviceName">未接続</strong><p id="support" class="muted">Bluetoothを確認しています…</p></div><div class="signal"><b id="state">OFFLINE</b><span id="lastSeen">—</span></div></section>
<section class="card timeline-card"><div class="section-title"><div><h2>メッセージ</h2><p class="history-caption">接続後・最新5件</p></div><button id="history" class="text-button" disabled>消去</button></div><div id="timeline" class="timeline" aria-live="polite"><p class="empty">接続後の送受信メッセージをここに表示します。</p></div></section>
<section class="composer card"><div class="section-title"><h2>メッセージ送信</h2><span id="counter">0 / 31</span></div><textarea id="message" maxlength="31" rows="3" placeholder="HELLO WORLD"></textarea><button id="send" class="primary" disabled>送信 <span>→</span></button></section>
<details class="card settings"><summary><span>端末設定</span><small>タップして開く</small></summary><div class="settings-grid">
<label>コールサイン<input data-command="CALLSIGN" value="JA25TS" maxlength="7"></label><label>送信速度 WPM<input data-command="CW_WPM" type="number" min="5" max="40" value="10"></label><label>受信速度 WPM<input data-command="RX_WPM" type="number" min="5" max="40" value="18"></label><label>電鍵音 Hz<input data-command="SIDETONE_HZ" type="number" min="300" max="1200" value="700"></label><label>モールス再生 Hz<input data-command="RX_TONE_HZ" type="number" min="300" max="1200" value="600"></label><label>送信音 低 Hz<input data-command="TX_LOW_HZ" type="number" min="300" max="2000" value="750"></label><label>送信音 高 Hz<input data-command="TX_HIGH_HZ" type="number" min="300" max="2000" value="1250"></label><label>受信通知 高 Hz<input data-command="RX_NOTICE_HIGH_HZ" type="number" min="300" max="2000" value="1250"></label><label>受信通知 低 Hz<input data-command="RX_NOTICE_LOW_HZ" type="number" min="300" max="2000" value="850"></label><label>ACK音 Hz<input data-command="ACK_HZ" type="number" min="300" max="2000" value="1500"></label><label>再送音 Hz<input data-command="RETRY_HZ" type="number" min="300" max="2000" value="500"></label><label>エラー音 Hz<input data-command="ERROR_HZ" type="number" min="300" max="2000" value="320"></label><label>スリープ 分<input data-command="SLEEP_MIN" type="number" min="0" max="1440" value="0"></label><label class="toggle">消音<input data-command="MUTED" type="checkbox"><span></span></label><label class="toggle">電池監視<input data-command="BATTERY" type="checkbox"><span></span></label><label>低電圧 mV<input data-command="LOW_BATTERY_MV" type="number" min="2500" max="4500" value="3400"></label><label>分圧比 ×100<input data-command="BATTERY_DIV_X100" type="number" min="100" max="500" value="200"></label>
</div><div class="setting-actions"><button id="save" class="primary" disabled>設定を保存</button><button id="refresh" disabled>再読込</button></div><p class="note">コールサインは保存後にESPを再起動するとBLE機器名にも反映されます。</p></details>
</main><div id="toast" role="status"></div><script src="app.js"></script></body></html>
